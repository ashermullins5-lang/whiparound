<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Whiparound</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Multiview for live sports: watch up to nine streams at once with live scores and automatic switching to the hottest game.">
  <meta name="theme-color" content="#0b0e14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Whiparound">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/hls.min.js" defer></script>
  <script src="vendor/mpegts.min.js" defer></script>
  <script src="js/app.js" type="module"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-main" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="5.5" y="7" width="9" height="7" rx=".8" fill="currentColor"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 8h13l-3-3M19 16H6l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-score" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6v12M7 10.5v3M16 10.5h2v3h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-pip" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="11.5" width="7" height="5.5" rx=".8" fill="currentColor"/></symbol>
      <symbol id="i-airplay" viewBox="0 0 24 24"><path d="M6.5 17H4.5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 14l5 6H7z" fill="currentColor"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-games" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="19" cy="18" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 3l3 3.5L15 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2.5L5 13.5h6l-1 8 8.5-11h-6z" fill="currentColor"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.5 3.5 5.5 5.5 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.4-4.2 2.6-5.3.2 1.8 1 2.8 2 3.3C10.8 8.6 11 5.4 12 2.5z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <header class="bar" id="bar">
      <div class="brand">
        <span class="wordmark">Whiparound</span>
        <span class="demo-tag" id="demoTag" hidden>Demo</span>
      </div>
      <div class="layouts" id="layouts" role="radiogroup" aria-label="Layout"></div>
      <div class="bar-actions">
        <button class="whip-toggle" id="whipBtn" type="button" aria-pressed="false" title="Auto Whip (W)">
          <svg class="i" aria-hidden="true"><use href="#i-bolt"></use></svg>
          <span>Auto Whip</span>
        </button>
        <button class="icon-btn" id="muteBtn" type="button" title="Mute all (M)" aria-pressed="false">
          <svg class="i" aria-hidden="true"><use href="#i-sound"></use></svg>
        </button>
        <button class="icon-btn" id="channelsBtn" type="button" title="Channels (C)">
          <svg class="i" aria-hidden="true"><use href="#i-tv"></use></svg><span class="lbl">Channels</span>
        </button>
        <button class="icon-btn" id="gamesBtn" type="button" title="Games (G)" aria-pressed="true">
          <svg class="i" aria-hidden="true"><use href="#i-games"></use></svg><span class="lbl">Games</span>
        </button>
        <button class="icon-btn" id="fsBtn" type="button" title="Full screen (F)">
          <svg class="i" aria-hidden="true"><use href="#i-expand"></use></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" title="Settings">
          <svg class="i" aria-hidden="true"><use href="#i-gear"></use></svg>
        </button>
        <button class="icon-btn" id="helpBtn" type="button" title="Help and shortcuts (?)">
          <svg class="i" aria-hidden="true"><use href="#i-help"></use></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="grid" id="grid" data-layout="2x2"></div>
      <div class="whip-banner" id="whipBanner" role="status" aria-live="polite" hidden></div>
      <div class="welcome" id="welcome" hidden></div>
    </main>

    <aside class="panel" id="panel" aria-label="Games">
      <div class="panel-head">
        <h2>Games</h2>
        <span class="feed-status" id="feedStatus">Loading scores…</span>
        <button class="icon-btn panel-close" id="panelClose" type="button" title="Close">
          <svg class="i" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="filters" id="filters" role="tablist" aria-label="League"></div>
      <div class="games" id="games"></div>
    </aside>

    <footer class="ticker" id="ticker" aria-label="Live scores"><div class="ticker-track" id="tickerTrack"></div></footer>
  </div>

  <dialog class="sheet" id="dlg" aria-labelledby="dlgTitle">
    <div class="sheet-head">
      <h2 id="dlgTitle"></h2>
      <button class="icon-btn" type="button" data-close title="Close">
        <svg class="i" aria-hidden="true"><use href="#i-close"></use></svg>
      </button>
    </div>
    <div class="sheet-body" id="dlgBody"></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
