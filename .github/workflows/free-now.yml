# Every 15 minutes: check which official free channels (data/free-sources.json) are live,
# and publish the result as free-now.json on the "free-now" branch. The site reads it from
# https://raw.githubusercontent.com/<owner>/<repo>/free-now/free-now.json
name: Free games now

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # every 15 minutes, off the busy top of the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: free-now
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check which official free channels are live
        run: node scripts/free-now.mjs out/free-now.json

      - name: Publish to the free-now branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b free-now
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add free-now.json
          git commit -q -m "Free games check $(date -u +%Y-%m-%dT%H:%MZ)"
          # One commit, replaced each run, so the branch never grows.
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" free-now
